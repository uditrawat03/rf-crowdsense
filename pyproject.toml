[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rf-crowdsense"
version = "0.4.0"
description = "GPU-accelerated aggregate RF activity estimation from synthetic or authorized IQ data"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
authors = [{ name = "Udit" }]
dependencies = [
  "numpy>=2.3",
  "typer>=0.16",
  "rich>=14.0",
  "pydantic>=2.11",
]

[project.optional-dependencies]
pytorch = [
  "torch==2.14.0",
  "torchvision==0.29.0",
]
tensorflow = [
  "tf-nightly>=2.22.0.dev20260920,<2.23",
]
tensorflow-gpu = [
  "tf-nightly[and-cuda]>=2.22.0.dev20260920,<2.23; sys_platform == 'linux'",
]
api = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
rfcrowd = "rf_crowdsense.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_crowdsense"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
